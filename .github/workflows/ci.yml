name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Catalog, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Catalog tests (includes PowerShell parse of every embedded script)
        run: npm test
        env:
          PWSH: pwsh
      - name: Parse engine scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse engine, tests -Filter *.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Host "$($f.Name):$($x.Extent.StartLineNumber) $($x.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - run: npm run typecheck
      - run: npm run build:renderer

  engine-windows:
    name: Engine round trip (Windows, disposable VM)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export-catalog.cjs build/catalog.json
      - name: Apply and revert every tweak, verify originals are restored
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\engine.roundtrip.ps1 -Catalog build\catalog.json

  package-windows:
    name: Package (unsigned, not published)
    runs-on: windows-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: tickrate-windows
          path: |
            release/*.exe
          retention-days: 14
