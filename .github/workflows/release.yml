name: Release

# Publishes a GitHub Release (installer + portable exe) whenever the version in
# package.json changes on main and no release exists for it yet. GitHub creates the
# v<version> tag automatically. Release notes come from docs/release-notes/v<version>.md.
# Pushing a v* tag or running the workflow manually also works.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml, 'docs/release-notes/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$version already exists; syncing its notes only."
            notes="docs/release-notes/v$version.md"
            if [ -f "$notes" ]; then gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --title "Tickrate v$version" --notes-file "$notes"; fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Will release v$version."
          fi

  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:renderer
      # Build first, then create the release in one call. (Letting electron-builder publish
      # makes its parallel targets race to create the same release.)
      - name: Build installers
        run: npx electron-builder --win --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.check.outputs.version }}"
          notes="docs/release-notes/$tag.md"
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tickrate $tag")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$tag" release/Tickrate-*.exe "${args[@]}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
